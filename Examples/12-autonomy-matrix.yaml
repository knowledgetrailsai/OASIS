# Autonomy Matrix -- table-form artifact (array of rows), one row per distinct action.
- action: "Draft a recommended resolution for a mismatched-amount exception"
  case_class: "Amount mismatch, PO exists, variance under 10%"
  risk_level: "Low -- draft only, analyst approves before any system-of-record change"
  current_system_capability_evidenced: "92% draft-acceptance rate on Phase 2 evaluation set (n=1,140 held-out cases)"
  human_authority_required: "Analyst must approve before the resolution is written back to SAP; assistant cannot act unilaterally"
  operating_limits: "US/CA queue only; variance under 10% of invoice amount"
  evidence_threshold_to_progress: "Sustained >=90% draft-acceptance rate over 2 consecutive months in production before removing the 10%-variance ceiling"
  escalation_trigger: "Variance exceeds 10%, or PO is a blanket PO lacking line-item detail"
  suspension_trigger: "Draft-acceptance rate falls below 75% in any rolling 2-week window"

- action: "Flag a suspected duplicate invoice"
  case_class: "Duplicate-pattern match against vendor master and payment history"
  risk_level: "Medium -- a false positive delays a legitimate payment; a false negative risks a duplicate payment"
  current_system_capability_evidenced: "False-positive rate 0.8% on Phase 2 evaluation set -- above the 0.5% guardrail in the Outcome Charter, not yet cleared for production"
  human_authority_required: "Analyst reviews every flagged duplicate before the invoice is held; assistant never holds payment unilaterally"
  operating_limits: "US/CA queue only; flags only, does not place payment holds"
  evidence_threshold_to_progress: "False-positive rate must reach <=0.5% on a re-run evaluation, expected after the EMEA vendor-master dedup work is scoped separately and US/CA vendor records are re-verified"
  escalation_trigger: "Any flagged case involving a vendor with a payment in the last 7 days"
  suspension_trigger: "False-positive rate exceeds 2% in any rolling week, or any confirmed duplicate payment traced to a missed flag"

- action: "Place an automatic payment hold on a suspected-duplicate invoice"
  case_class: "N/A -- not authorized"
  risk_level: "High -- direct financial and vendor-relationship impact"
  current_system_capability_evidenced: "Not evaluated; out of scope for this charter"
  human_authority_required: "Full human authority -- this action is not delegated to the assistant under the current Outcome Charter scope exclusion (no autonomous payment release)"
  operating_limits: "Not authorized under any condition within this charter's scope"
  evidence_threshold_to_progress: "Would require a new Outcome Charter and Value and Risk Case -- out of scope for this initiative as chartered"
  escalation_trigger: "N/A"
  suspension_trigger: "N/A"
