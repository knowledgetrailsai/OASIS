# Outcome Scorecard -- table-form artifact (array of 7 fixed dimension rows), dated snapshot.
# Snapshot date: 2026-09-15 (month 3 in production)
- dimension: "Outcome"
  metric: "Average exception resolution time"
  current: "5.4 minutes"
  threshold_or_target: "Under 5 minutes, sustained 2 consecutive months"
  trend: "Improving (was 7.1 min at month 1, 6.0 min at month 2)"
  commentary: "On track; one more month at or under 5 minutes closes the charter's target."
  action: "None -- continue monitoring"

- dimension: "Adoption"
  metric: "% of eligible exceptions routed through the assistant"
  current: "88%"
  threshold_or_target: "80%+"
  trend: "Stable"
  commentary: "Remaining 12% are blanket-PO cases explicitly out of scope, not an adoption gap."
  action: "None"

- dimension: "Intelligence"
  metric: "Draft-acceptance rate (mismatch cases)"
  current: "94%"
  threshold_or_target: ">=90%"
  trend: "Improving"
  commentary: "Exceeding threshold since month 2."
  action: "None"

- dimension: "Risk"
  metric: "Duplicate-flag false-positive rate"
  current: "0.6%"
  threshold_or_target: "<=0.5%"
  trend: "Improving (was 0.8% at Production Readiness gate)"
  commentary: "Still above guardrail. Vendor-master re-verification (from the Data Readiness Assessment) is 70% complete; expected to clear threshold next month."
  action: "Keep duplicate-flagging in shadow mode per the Decision-Gate Record condition; re-evaluate at next scorecard review."

- dimension: "Service"
  metric: "Uptime / incident count"
  current: "99.9%, 0 Sev-1 incidents"
  threshold_or_target: "99.5%+, 0 Sev-1"
  trend: "Stable"
  commentary: "No service-health concerns."
  action: "None"

- dimension: "Economics"
  metric: "Cost per resolved exception (assistant + human time)"
  current: "$2.10"
  threshold_or_target: "Under $3.50 (from Value and Risk Case)"
  trend: "Stable"
  commentary: "Comfortably under target; token cost is a small fraction of total (see Fulcrum cost-per-token tracking)."
  action: "None"

- dimension: "Reuse"
  metric: "Scale and Productization Assessment status"
  current: "Not yet assessed"
  threshold_or_target: "Assess after target sustained 2 consecutive months"
  trend: "N/A"
  commentary: "Too early -- charter target not yet sustained for the required 2 months."
  action: "Revisit at next month's scorecard if target holds."
