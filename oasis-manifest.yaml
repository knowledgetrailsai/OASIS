# oasis-manifest.yaml
# Machine-readable index of the OASIS methodology: parts, chapters, companion repositories,
# lifecycle phases, decision gates, and the 20 artifacts. Generated from the prose in
# methodology/, Architecture/, and Tools/ — if this ever drifts from those, the prose wins
# and this file should be regenerated. See llms.txt for the human/LLM-readable map and
# References/task-to-artifact-routing-table.md for "which artifact do I need" guidance.

methodology:
  name: OASIS
  full_name: Outcome-as-a-Service using Intelligence Systems
  version: "2026"
  license: MIT
  repository: https://github.com/knowledgetrailsai/OASIS
  default_branch: main
  entry_points:
    - 00-handbook-introduction.md
    - README.md
  companion_repository_index: References/companion-repository-index.md
  master_glossary: References/master-glossary-and-roles-roster.md
  lifecycle_definitions: oasis-lifecycle.yaml
  routing_table: References/task-to-artifact-routing-table.md
  artifact_schemas_dir: Schemas/

parts:
  - id: I
    title: Transformation Foundations
    chapters: [1, 2, 3, 4, 5, 6]
    path: methodology/part-i-transformation-foundations.md
  - id: II
    title: The OASIS Lifecycle
    chapters: [7, 8, 9, 10, 11, 12, 13]
    path: methodology/part-ii-the-oasis-lifecycle.md
  - id: III
    title: Intelligence-System Engineering and Assurance
    chapters: [14, 15, 16, 17, 18, 19, 20, 21, 22]
    path: methodology/part-iii-intelligence-system-engineering-and-assurance.md
  - id: IV
    title: Delivery and Enterprise Enablement
    chapters: [23, 24, 25]
    path: methodology/part-iv-delivery-and-enterprise-enablement.md
  - id: V
    title: Measurement, Scaling and Institutionalization
    chapters: [26, 27, 28, 29, 30, 31, 32, 33]
    path: methodology/part-v-measurement-scaling-and-institutionalization.md

